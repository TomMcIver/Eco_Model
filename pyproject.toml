[project]
name = "eco-model"
version = "0.1.0"
description = "NZ economic digital twin: first reproducible vertical slice (point-in-time macro forecast backtests and static under-25 tax calculator)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "pandas>=2.2",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
    "requests>=2.32",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]

[project.scripts]
eco-model = "eco_model.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eco_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: test requires internet access to official sources"]
